<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No internet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            color: #202124;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 90%;
            padding: 20px;
        }
        .icon {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="%202124" d="M12 28h-2v-4h2v4zm4-8h-2v4h2v-4zm4-4h-2v4h2v-4zm4-4h-2v4h2v-4zm4 0h2v4h-2v-4zm4 4h2v4h-2v-4zm4 4h2v4h-2v-4zm4 4h2v4h-2v-4zm-8 16h8v-4h-8v4zm-8-4h8v-4h-8v4zm-8 4h8v-4h-8v4zm0 4h8v-4h-8v4zm-12-8h4v-4h-4v4zm0-4h4v-4h-4v4zm0-4h4v-4h-4v4zm16 12h4v-4h-4v4zm4 0h4v-4h-4v4z"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
        }
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 16px 0;
            color: #202124;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #5f6368;
            margin: 0 0 16px 0;
        }
        ul {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.6;
            padding-left: 20px;
            margin-top: 8px;
        }
        li {
            margin-bottom: 4px;
        }
        .error-code {
            color: #5f6368;
            font-size: 12px;
            margin-top: 30px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon"></div>
        <h1>No internet</h1>
        <p>Try:</p>
        <ul>
            <li>Checking the network cables, modem, and router</li>
            <li>Reconnecting to Wi-Fi</li>
        </ul>
        <div class="error-code">ERR_INTERNET_DISCONNECTED</div>
    </div>

</body>
</html>
